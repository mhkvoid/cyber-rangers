<section id="missions" class="screen">
  <div class="content panel">
    <div class="eyebrow">Choose your challenge</div>

    <h2 class="title">Make every click count.</h2>

    <p class="description">
      Choose a mission and practise one important safety skill.
    </p>

    <div class="stats" aria-label="Player statistics">
      <span>★ Stars: <strong id="stars">0</strong></span>
      <span>◆ Badges: <strong id="badges">0</strong></span>
    </div>

    <div class="grid">
      <button class="card mission-card" type="button" data-mission="password">
        <img src="assets/cards/shield.png" alt="" />
        <b>Password Shield</b>
        <small>Create stronger passwords.</small>
        <em>Start mission →</em>
      </button>

      <button class="card mission-card" type="button" data-mission="link">
        <img src="assets/cards/safelink.png" alt="" />
        <b>Safe Link Patrol</b>
        <small>Spot suspicious links.</small>
        <em>Start mission →</em>
      </button>

      <button class="card mission-card" type="button" data-mission="privacy">
        <img src="assets/cards/privacy.png" alt="" />
        <b>Privacy Quest</b>
        <small>Protect personal information.</small>
        <em>Start mission →</em>
      </button>

      <button class="card mission-card" type="button" data-mission="kindness">
        <img src="assets/cards/kindness.png" alt="" />
        <b>Kindness Defender</b>
        <small>Respond safely online.</small>
        <em>Start mission →</em>
      </button>
    </div>
  </div>
</section>
