<section id="results" class="screen">
  <div class="content panel results">
    <div class="eyebrow">Mission complete</div>

    <h2 class="title">Nice work!</h2>

    <p id="finalMessage" class="description"></p>

    <div class="rewards">
      <p>★ <span id="earnedStars">0</span> stars earned</p>
      <p>Score earned: <strong id="earnedScore">0</strong></p>
      <p id="badgeProgress">0 / 3 stars until your next badge</p>
      <p id="newAchievements" class="new-achievements"></p>
    </div>

    <div class="controls">
      <button id="playAgainButton" class="primary" type="button">
        Play again
      </button>

      <button class="secondary" type="button" data-screen="missions">
        Next mission
      </button>
    </div>
  </div>
</section>
