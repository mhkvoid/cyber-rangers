<section id="progress" class="screen">
  <div class="content panel">
    <div class="eyebrow">Your command centre</div>

    <h2 class="title">Progress you can feel.</h2>

    <p class="description">
      Total stars: <strong id="total-stars">0</strong>.<br>
      Badges: <strong id="badges-count">0</strong>.<br>
      Missions completed: <strong id="missions-completed">0</strong>.<br>
      Total score: <strong id="total-score">0</strong>.
    </p>

    <div id="badges-list" class="badges-list"></div>

    <div class="controls">
      <button id="resetProgressButton" class="secondary" type="button">
        Reset progress
      </button>
    </div>
  </div>
</section>
